[project]
name = "careerai-ai"
version = "0.1.0"
description = "CareerAI AI worker: PDF ayrıştırma, kişisel veri maskeleme, yetkinlik çıkarımı, eşleştirme, öneri"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    # AGPL lisanslı; proje açık kaynak/akademik olduğu sürece uygun. Ticari kullanımda lisans gözden geçirilmeli.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Ad tespiti için yerel NER modeli (pii/ner.py). Yoksa ad tespiti sadece kurallarla yapılır.
# Sunucuda torch'un CPU sürümü kurulmalı: --index-url https://download.pytorch.org/whl/cpu
# Sürümler T-030 ölçümündeki (karar #24) gibi sabit; değiştirirken ölçümü tekrarla.
ner = [
    "torch==2.15.0",
    "transformers==5.22.0",
]
dev = [
    "pytest>=8.3",
    # Sürümler backend ve scraper ile aynı sabit (infra/ci.md).
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parsing*", "pii*"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Testlerde tekrarlanabilir sahte veri (ör. rastgele TCKN) için random bilinçli; şifreleme amacı yok.
"tests/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "pdfminer.*", "torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true

# PyMuPDF'in tip bilgisi eksik; onu çağıran modüllerde "tipsiz çağrı" uyarısı kapalı.
[[tool.mypy.overrides]]
module = ["parsing.backends", "tests.parsing.*", "generate_cvs"]
disallow_untyped_calls = false
