# Alembic ayarları. backend/ klasöründen çalıştırın:
#   alembic -c app/db/alembic.ini upgrade head
# Veritabanı adresi alembic.ini'de değil, .env'deki DATABASE_URL'den okunur (migrations/env.py).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/../..
path_separator = os
timezone = Europe/Istanbul

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
