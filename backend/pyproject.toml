[project]
name = "careerai-backend"
version = "0.1.0"
description = "CareerAI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.2",
    "celery[redis]>=5.4,<6",
    "psycopg[binary]>=3.2",
    # CV yükleme (T-038)
    "python-multipart>=0.0.18",
    "pypdf[crypto]>=5.1",
    # Veritabanı (app/db, T-012 — Ataberk)
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # Kimlik doğrulama (T-037)
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    # Yönetim paneli (T-063 — Ataberk, app/admin/). itsdangerous: panel oturum çerezi (Starlette SessionMiddleware).
    "sqladmin==0.32.0",
    "itsdangerous>=2.2",
    "babel>=2.16",  # panelin Türkçe arayüzü (SQLAdmin çevirileri)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Sabit sürüm: CI ve herkesin bilgisayarı aynı kuralları uygulasın (infra/ci.md, "yerelde geçiyor CI'da düşüyor").
    # Güncellerken: sürümü burada artır, `ruff format .` + `mypy app tests` çalıştır, aynı PR'da gönder.
    "ruff==0.17.2",
    "mypy==2.4.0",
    # T-069: kapsam ölçümü ve TEST_DATABASE_URL / TEST_REDIS_URL verilmediğinde geçici PostgreSQL ve Redis (Docker).
    "pytest-cov==6.0.0",
    "testcontainers[postgres,redis]==4.9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# T-069 kabul kriteri: kapsam en az %70. Veritabanı testleri atlansa da (Docker yok) eşiğin üstünde kalır.
addopts = "--cov=app --cov-report=term-missing:skip-covered"

[tool.coverage.run]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Testlerde sahte şifreler (ör. şifreli PDF örneği, test parolaları) bilinçli
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu.*", "testcontainers.*"]
ignore_missing_imports = true
