# Production PC'sindeki metrik toplama (T-066). Sadece compose projesinin iç ağında çalışır, host'a port açmaz;
# panolar Grafana'dan (127.0.0.1) görülür. Ayrıntı: infra/monitoring/README.md
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Uyarılar kimseye gönderilmez (karar #32): tetiklenenler Grafana panosundaki "Aktif uyarılar" tablosunda görünür.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Docker Desktop'ın WSL2 sanal makinesi (CPU, RAM) ve Windows C: diski (/host/c).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Celery kuyrukları (analysis, data) ve Redis belleği.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Bağlantılar, veri tabanı boyutu ve careerai_* sorguları (postgres-exporter/queries.yaml).
  - job_name: postgres
    scrape_interval: 60s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # api hazır mı: içeriden (konteyner ağı) ve dışarıdan (Cloudflare Tunnel üzerinden).
  # PC kapanınca bunlar da durur; PC dışı izleme UptimeRobot'ta (README 3. adım).
  - job_name: health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/api/v1/health/ready
        labels:
          probe: ic
      - targets:
          - https://api.cvnebakalim.com/api/v1/health/ready
        labels:
          probe: dis
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
