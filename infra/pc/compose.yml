# Production ve prova ortamı (karar #30, T-035, T-075). Aynı dosya iki ayrı compose projesiyle çalışır:
#   production: docker compose -p careerai-prod    --env-file infra/pc/.env.prod    -f infra/pc/compose.yml ...
#   prova:      docker compose -p careerai-staging --env-file infra/pc/.env.staging -f infra/pc/compose.yml ...
# Elle yazmak yerine `bash infra/pc/deploy.sh` veya make hedefleri kullanılır (infra/pc/deploy.md).
#
# Host'a sadece Grafana açılır, o da 127.0.0.1'e (izleme profili). Dışarıdan tek giriş cloudflared'dir (Cloudflare Tunnel, sadece dışarıya bağlantı
# kurar). Sunum B planı için api'yi sadece bu PC'ye açan ek dosya: compose.local.yml.
# worker-ai / worker-analysis ve cv-redis, ai/Dockerfile (Burak) ve #58/#60 main'e girince buraya gelecek.

x-app-env: &app-env
  ENVIRONMENT: ${APP_ENVIRONMENT:?env dosyasında APP_ENVIRONMENT yok (production veya staging)}
  # En az yetkili rol (T-075, infra/pc/app-role.sql): veri okur/yazar, şema değiştiremez. Migration sahip rolle
  # çalışır (deploy.sh DATABASE_URL'i o adımda ezer). Rolü deploy.sh oluşturur.
  DATABASE_URL: postgresql+psycopg://careerai_app:${APP_DB_PASSWORD:?env dosyasında APP_DB_PASSWORD yok}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  OLLAMA_URL: http://ollama:11434
  # Ayarlar ortak olduğu için worker-data da bunu ister: geliştirme anahtarıyla açılmaz.
  JWT_SECRET: ${JWT_SECRET:?env dosyasında JWT_SECRET yok}
  TZ: Europe/Istanbul

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Cloudflare Tunnel. Sadece TUNNEL_TOKEN dolu ortamda açılır (COMPOSE_PROFILES=tunnel, env dosyasında).
  # Alan adı → servis eşlemesi Cloudflare panelinde yapılır: api.cvnebakalim.com → http://api:8000 (infra/pc/deploy.md).
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.8.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    image: careerai/api:${APP_ENVIRONMENT}  # deploy.sh GHCR imajını bu ada bağlar
    environment:
      <<: *app-env
      IP_HASH_SECRET: ${IP_HASH_SECRET:?env dosyasında IP_HASH_SECRET yok}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # İstek sınırları (rate_limits.py) istemci IP'sini X-Forwarded-For'dan alır. Sadece projenin kendi
      # ağına (cloudflared) güvenilir: uvicorn listeyi sondan okur ve bu alt ağın dışındaki ilk adresi alır,
      # yani Cloudflare'in eklediği gerçek IP'yi. "*" olsaydı istemcinin uydurduğu ilk adres kullanılırdı.
      FORWARDED_ALLOW_IPS: ${COMPOSE_SUBNET:?env dosyasında COMPOSE_SUBNET yok}
      # Yönetim paneli Cloudflare Access belgesini doğrular (backend/app/admin/access.py). Production'da boşsa
      # panel 503 döner, API'nin geri kalanı etkilenmez.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-data:
    image: careerai/worker-data:${APP_ENVIRONMENT}
    environment:
      <<: *app-env
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - scraper-data:/srv/scraper/data
    mem_limit: 1536m
    logging: *logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    # Hata loglarına değer yazılmasın (T-067): terse → "Key (email)=(…)" gibi DETAIL satırları yok;
    # log_min_error_statement=panic → hatalı sorgunun metni loglanmaz.
    # pg_stat_statements: yavaş sorgu ölçümü (go-live #18, `make prod-slow-queries`); sorgu metinleri normalleştirilir
    # (sabitler $1 olur), değer saklanmaz. Ayar değişince postgres yeniden oluşturulur (deploy sırasında).
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic",
              "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top",
              "-c", "pg_stat_statements.track_utility=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?env dosyasında POSTGRES_USER yok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?env dosyasında POSTGRES_PASSWORD yok}
      POSTGRES_DB: ${POSTGRES_DB:?env dosyasında POSTGRES_DB yok}
      TZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?env dosyasında REDIS_PASSWORD yok}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  # Günlük şifreli yedek (T-068): restic → PC dışı depo. Zamanlayıcı konteynerin içinde (02:00, kaçarsa açılışta).
  # Sadece RESTIC_REPOSITORY dolu ortamda açılır (COMPOSE_PROFILES=...,backup). Ayrıntı: infra/backup/README.md
  backup:
    profiles: ["backup"]
    build: ../backup
    image: careerai/backup:local
    environment:
      BACKUP_TAG: ${APP_ENVIRONMENT}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      # B2'ye S3 uyumlu adresinden bağlanılır: B2'nin kendi indirme sunucusu (f003.backblazeb2.com) Türkiye'deki
      # ağlarda TLS'te kesiliyor, restic sessizce tekrar deniyordu (15.11.2026). Anahtarlar aynı B2 uygulama anahtarı.
      AWS_ACCESS_KEY_ID: ${B2_ACCOUNT_ID:-}
      AWS_SECRET_ACCESS_KEY: ${B2_ACCOUNT_KEY:-}
      AWS_DEFAULT_REGION: eu-central-003
      TZ: Europe/Istanbul
    volumes:
      - backup-state:/state
      - restic-cache:/root/.cache/restic
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.13  # docker-compose.yml ile aynı sürüm
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 8g
    logging: *logging
    restart: unless-stopped

  # --- İzleme (T-066, infra/monitoring/README.md). Sadece production'da: COMPOSE_PROFILES=...,monitoring ---
  # Grafana tek arayüzdür ve sadece bu PC'ye açılır (127.0.0.1). Diğerleri iç ağda kalır.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped


  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    # Şifre boşsa Grafana admin/admin ile açılırdı: açılmasın.
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'GRAFANA_ADMIN_PASSWORD boş' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/careerai.json
      POSTGRES_DB: ${POSTGRES_DB}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:-}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  # --- Merkezi log (T-067): Alloy konteyner loglarını okur, maskeler → Loki 14 gün saklar → Grafana'da okunur ---
  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  # Docker soketine salt okunur erişir (konteyner listesi ve logları). Portu yok, sadece Loki'ye yazar.
  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.10.2
    command: ["run", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ../monitoring/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped
    depends_on:
      - loki

  # Docker Desktop'ın WSL2 sanal makinesini görür (CPU, RAM = .wslconfig sınırı). Windows C: diski
  # Docker Desktop'ın kendi bağlama noktasından salt okunur eklenir (/host/c), sadece boş alanı okunur.
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.9.1
    command:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|etc)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|sysfs|tmpfs|tracefs)$$
    volumes:
      - /run/desktop/mnt/host/c:/host/c:ro
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Celery kuyrukları Redis'te liste: analysis (backend/app/worker), data (scraper/collector/tasks.py).
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db0=analysis,db0=data
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # Salt okunur careerai_monitor rolüyle bağlanır; rolü deploy.sh oluşturur (setup_monitor_role).
  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    command: ["--extend.query-path=/etc/postgres-exporter/queries.yaml"]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: careerai_monitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:-}
    volumes:
      - ../monitoring/postgres-exporter:/etc/postgres-exporter:ro
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  blackbox-exporter:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../monitoring/blackbox:/etc/blackbox:ro
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Sabit alt ağ: api yalnızca buradan gelen yönlendirme başlıklarına güvenir (FORWARDED_ALLOW_IPS).
        - subnet: ${COMPOSE_SUBNET:?env dosyasında COMPOSE_SUBNET yok}

volumes:
  pgdata:
  redis-data:
  scraper-data:
  backup-state:
  restic-cache:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  # Model dosyaları (~5 GB) iki ortamda ortak: disk sınırlı (C: ~71 GB boş), model iki kez indirilmesin.
  # Dış volume: `down -v` ile prova kapatılırken production'ın modeli silinmesin. deploy.sh oluşturur.
  ollama:
    name: careerai-ollama-models
    external: true
