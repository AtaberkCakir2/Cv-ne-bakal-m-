# Staging ortamı (T-035). Komutlar: infra/server/README.md
#
# Dışarıya sadece Caddy açılır: Docker portları ufw'yi atlar, bu yüzden başka serviste `ports` kullanmayın.
# Staging kendi volume'larını kullanır; verisi production'dan ayrıdır.
# worker-ai, ai/Dockerfile (Burak) eklenince buraya gelecek; şimdilik analizler örnek sonuç döner.
name: careerai-staging

x-app-env: &app-env
  ENVIRONMENT: staging
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  OLLAMA_URL: http://ollama:11434
  # Ayarlar ortak olduğu için worker-data da bunu ister: staging'de geliştirme anahtarıyla açılmaz.
  JWT_SECRET: ${JWT_SECRET:?infra/staging/.env dosyasında JWT_SECRET yok}

services:
  caddy:
    image: caddy:2.8.4
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:?infra/staging/.env dosyasında STAGING_API_DOMAIN yok}
      ACME_EMAIL: ${ACME_EMAIL:?infra/staging/.env dosyasında ACME_EMAIL yok}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ../../backend
    image: careerai/api:staging
    environment:
      <<: *app-env
      IP_HASH_SECRET: ${IP_HASH_SECRET:?infra/staging/.env dosyasında IP_HASH_SECRET yok}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Konteyner dışarıya kapalı, tek istemcisi Caddy: gerçek IP başlığına güvenilebilir (istek sınırları, T-050).
      FORWARDED_ALLOW_IPS: "*"
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-data:
    build:
      context: ../..
      dockerfile: scraper/Dockerfile
    image: careerai/worker-data:staging
    environment:
      <<: *app-env
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - scraper-data:/srv/scraper/data
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?infra/staging/.env dosyasında POSTGRES_USER yok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/staging/.env dosyasında POSTGRES_PASSWORD yok}
      POSTGRES_DB: ${POSTGRES_DB:?infra/staging/.env dosyasında POSTGRES_DB yok}
      TZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?infra/staging/.env dosyasında REDIS_PASSWORD yok}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.13  # docker-compose.yml ile aynı sürüm
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 8g
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  redis-data:
  ollama:
  scraper-data:
